<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourenplan App</title>
    <style>
        /* Basis */
        body { font-family: sans-serif; padding: 5px; font-size: 10px; margin: 0; }
        .page { display: none; }
        .active { display: block; }
        
        .nav-bar { display: flex; gap: 5px; margin-bottom: 5px; background: #f0f0f0; padding: 5px; }
        button { cursor: pointer; padding: 4px 8px; font-size: 10px; }

        /* Tabelle */
        .table-container { width: 100%; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid #000; padding: 2px; text-align: center; vertical-align: top; }
        
        .cell-content { display: flex; flex-direction: column; height: 100%; gap: 1px; }
        .header-row { display: flex; justify-content: flex-end; height: 10px; }
        .undo-btn { cursor: pointer; border: none; background: none; font-size: 10px; color: #444; line-height: 1; padding: 0; }
        
        select { width: 100%; font-size: 7px; border: 1px solid #ccc; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; }

        /* DRUCK-LAYOUT */
        @media print {
            @page { size: landscape; margin: 5mm; }
            .nav-bar, .undo-btn { display: none !important; }
            body { font-size: 9pt; }
            table { border: 1px solid #000; width: 100% !important; }
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button onclick="showPage('plan')">Tourenplan</button>
        <button onclick="showPage('klienten')">Klienten</button>
        <button onclick="showPage('leistungen')">Leistungen</button>
        <button onclick="window.print()" style="background: #4a90e2; color: white;">PDF Drucken</button>
    </div>

    <div id="plan" class="page active">
        <div style="border-bottom: 1px solid #000; margin-bottom: 5px;">
            <h1>Tourenplan</h1>
            <input type="text" id="tourName" placeholder="Tourname..." style="width:100%; border:none; font-weight:bold;" oninput="saveAppState()">
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th style="width:30px;">Nr.</th><th>Mo</th><th>Di</th><th>Mi</th><th>Do</th><th>Fr</th></tr></thead>
                <tbody id="plan-body"></tbody>
            </table>
        </div>
    </div>

    <div id="klienten" class="page">
        <h1>Klienten</h1>
        <input type="text" id="kName"><button onclick="addData('klienten', 'kName')">Hinzufügen</button>
        <ul id="list-klienten"></ul>
    </div>

    <div id="leistungen" class="page">
        <h1>Leistungen</h1>
        <input type="text" id="lName"><button onclick="addData('leistungen', 'lName')">Hinzufügen</button>
        <ul id="list-leistungen"></ul>
    </div>

    <script>
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        const tbody = document.getElementById('plan-body');
        for(let i=1; i<=15; i++) {
            let row = `<tr><td>${i}</td>`;
            for(let j=0; j<5; j++) {
                row += `<td>
                    <div class="cell-content">
                        <div class="header-row"><button class="undo-btn" onclick="clearCell(this)">↺</button></div>
                        <select class="name-select" name="k_${i}_${j}" onchange="saveAppState()"></select>
                        <div class="grid-container">
                            <select class="task-select" name="l_${i}_${j}_1" onchange="saveAppState()"></select>
                            <select class="task-select" name="l_${i}_${j}_2" onchange="saveAppState()"></select>
                        </div>
                    </div>
                </td>`;
            }
            tbody.innerHTML += row + '</tr>';
        }

        // Restliche Funktionen (addData, del, renderLists, refreshDropdowns, save/loadAppState) analog beibehalten
        // [Hier den JS-Rest aus dem vorherigen Schritt einfügen]
    </script>
</body>
</html>
</html>
